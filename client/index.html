    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Calcutta Node",
      "url": "https://calcuttanode.vercel.app",
      "description": "IT services and digital growth agency in Kolkata, India.",
      "publisher": {
        "@type": "Organization",
        "name": "Calcutta Node",
        "logo": { "@type": "ImageObject", "url": "https://calcuttanode.vercel.app/logo.png" }
      },
      "potentialAction": {
        "@type": "SearchAction",

        "query-input": "required name=search_term_string"
      }
    }

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // No-FOUC theme init: Night (dark) is the signature logo look; respect saved choice first.
      (function () {
        try {
          var saved = localStorage.getItem('cn-theme');
          var theme = saved || 'dark';
          if (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          }
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
